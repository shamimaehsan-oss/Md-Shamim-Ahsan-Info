<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ ৬৪ জেলার লাইভ আবহাওয়া ও তথ্য</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2rem;
            color: #00d2ff;
            margin-bottom: 10px;
        }

        .search-box {
            margin-top: 15px;
        }

        .search-box input {
            padding: 10px 15px;
            width: 80%;
            max-width: 400px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(5px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.2);
        }

        .district-name {
            font-size: 1.4rem;
            color: #ffcb74;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.95rem;
        }

        .temp {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00f2fe;
        }

        .warning {
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: bold;
        }

        .safe { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .rain-risk { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
        .flood-risk { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>
        <h1>🇧🇩 বাংলাদেশ ৬৪ জেলার লাইভ আবহাওয়া ড্যাশবোর্ড</h1>
        <p>লাইভ তাপমাত্রা, বৃষ্টির সম্ভাবনা ও পূর্বাভাসের নজরদারি</p>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="filterDistricts()" placeholder="জেলার নাম লিখুন (যেমন: ঢাকা, সিলেট)...">
        </div>
    </header>

    <div class="grid-container" id="weatherGrid">
        <!-- জেলার কার্ডগুলো এখানে ডাইনামিকালি তৈরি হবে -->
    </div>

    <script>
        // বাংলাদেশের ৬৪টি জেলার ল্যাটিটিউড এবং লঙ্গিটিউড ডাটা
        const districts = [
            { name: "ঢাকা", lat: 23.8103, lon: 90.4125 },
            { name: "চট্টগ্রাম", lat: 22.3569, lon: 91.7832 },
            { name: "সিলেট", lat: 24.8949, lon: 91.8687 },
            { name: "রাজশাহী", lat: 24.3636, lon: 88.6241 },
            { name: "খুলনা", lat: 22.8456, lon: 89.5403 },
            { name: "বরিশাল", lat: 22.7010, lon: 90.3535 },
            { name: "রংপুর", lat: 25.7439, lon: 89.2752 },
            { name: "ময়মনসিংহ", lat: 24.7471, lon: 90.4203 },
            { name: "কুমিল্লা", lat: 23.4607, lon: 91.1809 },
            { name: "কক্সবাজার", lat: 21.4272, lon: 92.0058 },
            { name: "নোয়াখালী", lat: 22.8696, lon: 91.0991 },
            { name: "ফেনী", lat: 23.0159, lon: 91.3976 },
            { name: "বগুড়া", lat: 24.8481, lon: 89.3730 },
            { name: "পাবনা", lat: 24.0063, lon: 89.2493 },
            { name: "যশোর", lat: 23.1664, lon: 89.2081 },
            { name: "দিনাজপুর", lat: 25.6217, lon: 88.6354 },
            { name: "কুষ্টিয়া", lat: 23.9013, lon: 89.1204 },
            { name: "টাঙ্গাইল", lat: 24.2513, lon: 89.9167 },
            { name: "ফরিদপুর", lat: 23.6070, lon: 89.8429 },
            { name: "গাজীপুর", lat: 23.9999, lon: 90.4203 },
            { name: "নারায়ণগঞ্জ", lat: 23.6238, lon: 90.5000 },
            { name: "ব্রাহ্মণবাড়িয়া", lat: 23.9571, lon: 91.1119 },
            { name: "চাঁদপুর", lat: 23.2333, lon: 90.6667 },
            { name: "লক্ষ্মীপুর", lat: 22.9447, lon: 90.8282 },
            { name: "হবিগঞ্জ", lat: 24.3749, lon: 91.4155 },
            { name: "মৌলভীবাজার", lat: 24.4829, lon: 91.7774 },
            { name: "সুনামগঞ্জ", lat: 25.0658, lon: 91.3950 },
            { name: "নাটোর", lat: 24.4206, lon: 89.0000 },
            { name: "নওগাঁ", lat: 24.7936, lon: 88.9318 },
            { name: "সিরাজগঞ্জ", lat: 24.4534, lon: 89.7008 },
            { name: "জয়পুরহাট", lat: 25.1008, lon: 89.0232 },
            { name: "চাঁপাইনবাবগঞ্জ", lat: 24.5965, lon: 88.2775 },
            { name: "কুড়িগ্রাম", lat: 25.8054, lon: 89.6361 },
            { name: "গাইবান্ধা", lat: 25.3288, lon: 89.5403 },
            { name: "লালমনিরহাট", lat: 25.9165, lon: 89.4532 },
            { name: "নীলফামারী", lat: 25.9312, lon: 88.8560 },
            { name: "পঞ্চগড়", lat: 26.3411, lon: 88.5541 },
            { name: "ঠাকুরগাঁও", lat: 26.0337, lon: 88.4617 },
            { name: "সাতক্ষীরা", lat: 22.7185, lon: 89.0705 },
            { name: "বাগেরহাট", lat: 22.6516, lon: 89.7859 },
            { name: "ঝিনাইদহ", lat: 23.5448, lon: 89.1539 },
            { name: "মাগুরা", lat: 23.4873, lon: 89.4199 },
            { name: "নড়াইল", lat: 23.1725, lon: 89.5126 },
            { name: "মেহেরপুর", lat: 23.7622, lon: 88.6318 },
            { name: "চুয়াডাঙ্গা", lat: 23.6402, lon: 88.8418 },
            { name: "পটুয়াখালী", lat: 22.3596, lon: 90.3298 },
            { name: "ভোলা", lat: 22.6859, lon: 90.6481 },
            { name: "বরগুনা", lat: 22.1528, lon: 90.1256 },
            { name: "ঝালকাঠি", lat: 22.6406, lon: 90.1987 },
            { name: "পিরোজপুর", lat: 22.5841, lon: 89.9720 },
            { name: "নেত্রকোণা", lat: 24.8709, lon: 90.7279 },
            { name: "শেরপুর", lat: 25.0205, lon: 90.0153 },
            { name: "জামালপুর", lat: 24.9375, lon: 89.9377 },
            { name: "কিশোরগঞ্জ", lat: 24.4449, lon: 90.7765 },
            { name: "মানিকগঞ্জ", lat: 23.8644, lon: 90.0047 },
            { name: "মুন্সীগঞ্জ", lat: 23.5422, lon: 90.5305 },
            { name: "রাজবাড়ী", lat: 23.7574, lon: 89.6444 },
            { name: "মাদারীপুর", lat: 23.1641, lon: 90.1897 },
            { name: "গোপালগঞ্জ", lat: 23.0051, lon: 89.8266 },
            { name: "শরীয়তপুর", lat: 23.2423, lon: 90.4348 },
            { name: "রাঙ্গামাটি", lat: 22.6533, lon: 92.1789 },
            { name: "বান্দরবান", lat: 22.1953, lon: 92.2184 },
            { name: "খাগড়াছড়ি", lat: 23.1192, lon: 91.9847 }
        ];

        const grid = document.getElementById('weatherGrid');

        // কার্ড তৈরি করার প্রাথমিক ফাংশন
        function createCards() {
            districts.forEach((district, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${index}`;
                card.innerHTML = `
                    <div class="district-name">${district.name}</div>
                    <div class="loading">লাইভ ডাটা লোড হচ্ছে...</div>
                `;
                grid.appendChild(card);
                fetchWeather(district, index);
            });
        }

        // লাইভ আবহাওয়া ডাটা API কল
        async function fetchWeather(district, index) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${district.lat}&longitude=${district.lon}&current_weather=true&hourly=precipitation_probability,rain`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                const temp = data.current_weather.temperature;
                const wind = data.current_weather.windspeed;
                const rainProb = data.hourly.precipitation_probability[0] || 0;
                const rainAmount = data.hourly.rain[0] || 0;

                // বন্যার ঝুঁকি গণনা
                let statusText = "স্বাভাবিক পরিবেশ";
                let statusClass = "safe";

                if (rainAmount > 10 || (rainProb > 70 && (district.name === "সিলেট" || district.name === "সুনামগঞ্জ" || district.name === "কুড়িগ্রাম" || district.name === "ফেনী"))) {
                    statusText = "⚠️ বন্যার ঝুঁকিপূর্ণ এলাকা";
                    statusClass = "flood-risk";
                } else if (rainProb > 50 || rainAmount > 2) {
                    statusText = "🌧️ বৃষ্টির সম্ভাবনা রয়েছে";
                    statusClass = "rain-risk";
                }

                const card = document.getElementById(`card-${index}`);
                card.innerHTML = `
                    <div class="district-name">${district.name}</div>
                    <div class="info-row">
                        <span>তাপমাত্রা:</span>
                        <span class="temp">${temp}°C</span>
                    </div>
                    <div class="info-row">
                        <span>বাতাসের গতি:</span>
                        <span>${wind} km/h</span>
                    </div>
                    <div class="info-row">
                        <span>বৃষ্টির সম্ভাবনা:</span>
                        <span>${rainProb}%</span>
                    </div>
                    <div class="warning ${statusClass}">${statusText}</div>
                `;
            } catch (error) {
                const card = document.getElementById(`card-${index}`);
                card.innerHTML = `
                    <div class="district-name">${district.name}</div>
                    <div style="color: #ff6b6b;">ডাটা লোড করা যায়নি!</div>
                `;
            }
        }

        // জেলা সার্চ করার সুবিধা
        function filterDistricts() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('card');

            for (let i = 0; i < cards.length; i++) {
                const districtName = cards[i].getElementsByClassName('district-name')[0].innerText;
                if (districtName.toLowerCase().includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // পেজ লোড হলে কার্ডগুলো লোড হবে
        window.onload = createCards;
    </script>
</body>
</html>
