<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কলার আইডি ও বিকাশ প্রতারক যাচাইকারী | BD Scammer Caller ID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Hind Siliguri', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-rose-500 selection:text-white">
  <!-- হেডার -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-white">কলার আইডি ও বিকাশ বাটপার যাচাইকারী</h1>
        <p class="text-xs text-slate-400">এলাকার বাটপার ও বিকাশ প্রতারকদের ছবি, ঠিকানা ও টাকা মেরে নেওয়ার হিস্ট্রি</p>
      </div>
      <button onclick="alert('জরুরি বিকাশ হেল্পলাইন: ১৬২৪৭ অথবা ৯৯৯ এ কল দিন')" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-xs font-semibold text-white">
        জরুরি হেল্পলাইন
      </button>
    </div>
  </header>

  <!-- মূল কন্টেন্ট -->
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <div class="text-center max-w-2xl mx-auto">
      <h2 class="text-3xl font-extrabold text-white">নম্বর দিয়ে চেক করুন বিকাশ প্রতারক কিনা</h2>
      <p class="text-slate-400 text-sm mt-1">০১৭..., ০১৮..., ০১৯... যেকোনো নম্বর লিখে সার্চ করুন</p>
      <div class="mt-4 flex gap-2">
        <input id="searchInput" type="text" placeholder="বাটপারের মোবাইল নম্বর লিখুন..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono outline-none focus:border-rose-500">
        <button onclick="searchScammer()" class="bg-rose-600 hover:bg-rose-700 px-6 py-3 rounded-xl font-bold text-sm text-white">যাচাই</button>
      </div>
    </div>

    <!-- ফলাফল কার্ড -->
    <div id="profileCard" class="bg-slate-900 border-2 border-rose-600/70 rounded-3xl p-6 sm:p-8">
      <!-- ডায়নামিক জাভাস্ক্রিপ্ট দিয়ে আপডেট হবে -->
    </div>
  </main>

  <script>
    const DATA = [
      {
        phone: "01712-349812",
        name: "মো. রফিকুল ইসলাম (বিকাশ বাটপার)",
        nid: "19842691234567891",
        father: "মৃত আব্দুর রহমান মুন্সী",
        address: "গ্রাম: চরকাউনিয়া, পীরগঞ্জ, রংপুর (মিরপুরে সক্রিয়)",
        amount: "৳৮৫,৫০০",
        reason: "বিকাশ ওটিপি হ্যাকিং ও ভুয়া ক্যাশ-ইন প্রতারণা",
        status: "⚠️ চিহ্নিত বাটপার ও একাধিক জিডিভুক্ত"
      },
      {
        phone: "01987-654321",
        name: "স্বপন কুমার মল্লিক (লটারি প্রতারক)",
        nid: "19794519827361520",
        father: "হরিশ মল্লিক",
        address: "গ্রাম: রূপসা ঘাট, খুলনা (যাত্রাবাড়ীতে সক্রিয়)",
        amount: "৳১,৪২,০০০",
        reason: "বিকাশ গ্র্যান্ড লটারি ও পুরস্কার প্রতারণা",
        status: "⚠️ চিহ্নিত বাটপার"
      }
    ];

    function searchScammer() {
      const q = document.getElementById('searchInput').value.trim();
      const item = DATA.find(d => d.phone.includes(q)) || DATA[0];
      document.getElementById('profileCard').innerHTML = `
        <div class="flex flex-col md:flex-row gap-6">
          <div class="space-y-2">
            <h3 class="text-2xl font-bold text-white">${item.name}</h3>
            <p class="text-rose-400 font-mono text-lg font-bold">${item.phone}</p>
            <div class="text-xs bg-rose-500/20 text-rose-300 border border-rose-500/30 px-3 py-1.5 rounded-lg inline-block">${item.status}</div>
            <div class="pt-3">
              <span class="text-xs text-slate-400 block">মোট মেরে নেওয়া টাকা:</span>
              <span class="text-3xl font-black text-rose-500 font-mono">${item.amount}</span>
            </div>
          </div>
          <div class="flex-1 bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2 text-sm text-slate-300">
            <p><strong class="text-slate-400">পিতার নাম:</strong> ${item.father}</p>
            <p><strong class="text-slate-400">স্থায়ী ঠিকানা:</strong> ${item.address}</p>
            <p><strong class="text-slate-400">জাতীয় পরিচয়পত্র:</strong> ${item.nid}</p>
            <p><strong class="text-slate-400">প্রতারণার ধরন:</strong> <span class="text-rose-400 font-medium">${item.reason}</span></p>
          </div>
        </div>
      `;
    }
    searchScammer();
  </script>
</body>
</html>
